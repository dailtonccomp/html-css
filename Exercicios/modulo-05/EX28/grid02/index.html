<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container {
            border: 3px solid blue;
            height: 250px;
            display: grid;
            /* 
            Para substituir grid-template-columns e grid-template-rows usamos o comando grid-template sendo primeiro o row e depois column
            grid-template-columns: auto auto auto;
            grid-template-rows: 100px 100px 100px;
            */
            grid-template: repeat(3, auto) / repeat(3, auto); 
            gap: 10px;
            /* Para inserir uma nova linha atomaticamente utilizamos o grid-auto-rows */
            grid-auto-rows: 100px;
            /* Para inserir uma nova coluna atomaticamente utilizamos o         grid-auto-columns.*/
            grid-auto-columns: initial;
            /*
            place-items é utilizado para exemplificar align-items e justify-items respectivamente
            align-items: normal;
            justify-items: normal;
            */
            place-items: start center;
            /*
            place-content é utilizado para exemplificar align-content e justify-content respectivamente.
            align-content: normal;
            justify-content: normal;
            */
            place-content: space-between end;
            
        }

        div.item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
    </div>
</body>
</html>
